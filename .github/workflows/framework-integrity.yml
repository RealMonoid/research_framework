name: Framework integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements-dev.txt
      - run: python scripts/validate_framework.py

  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate PowerShell entry point
        shell: pwsh
        run: .\scripts\validate_framework.ps1 -PythonExecutable (Get-Command python).Source
